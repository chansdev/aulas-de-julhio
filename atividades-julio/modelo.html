<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades de Heitor</title>

    <link rel="stylesheet" href="./styel.css">
    <link rel="shortcut icon" href="./bigode.jpg" type="image/x-icon">
</head>
<body>
    <h1>Qual atividade quer ver agora?</h1>
    <select name="atvOpc" id="atvOpc">
        <option value="atv1">Atividade 1</option>
        <option value="atv2">Atividade 2</option>
        <option value="atv3">Atividade 3</option>
        <option value="atv4">Atividade 4</option>
        <option value="atv4">Atividade 5</option>
        <option value="atv4">Atividade 6</option>
        <option value="atv4">Atividade 7</option>
        <option value="atv4">Atividade 8</option>
        <option value="atv4">Atividade 9</option>
        <option value="atv4">Atividade 10</option>
    </select>

    <section class="opcao" id="atv1">
        <h1>teste 1</h1>
    </section>
    <section class="opcao" id="atv2">
        <h1>teste 2</h1>
    </section>
    <section class="opcao" id="atv3">
        <h1>teste 3</h1>
    </section>
    <section class="opcao" id="atv4">
        <h1>teste 4</h1>
    </section>
    <section class="opcao" id="atv5">
        <h1>teste 5</h1>
    </section>
    <section class="opcao" id="atv6">
        <h1>teste 6</h1>
    </section>
    <section class="opcao" id="atv7">
        <h1>teste 7</h1>
    </section>
    <section class="opcao" id="atv8">
        <h1>teste 8</h1>
    </section>
    <section class="opcao" id="atv9">
        <h1>teste 9</h1>
    </section>
    <section class="opcao" id="atv10">
        <h1>teste 10</h1>
    </section>

    <script>
        opcao = document.querySelector("#atvOpc");
        document.querySelectorAll(".opcao").forEach( (e) => {
            e.style.display = "none"
        })
        opcao.value = "none"

        opcao.addEventListener("change", () => {
            document.querySelectorAll(".opcao").forEach( (e) => {
            e.style.display = "none"
        })

            document.querySelector(`#${opcao.value}`).style.display = "grid";
        })
    </script>
</body>
</html>
